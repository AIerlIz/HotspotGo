# 发布:推一个 v* 的 tag 就自动构建 → 测试 → 冒烟 → 创建 GitHub Release。
#
# 为什么"部署"是发 Release:
#   本工具是一个自带界面的 Windows 桌面 exe,没有服务端可以部署 ——
#   它的分发方式就是"给一个能直接下载运行的 exe",所以发布产物即部署产物。
#   如果你的目标其实是"把新版本推到某台固定机器上",那需要一台 self-hosted runner,
#   可以再加一个 job,与本文件互不影响。
#
# 附件只有 HotspotGo.exe,不打包 zip,也不另发校验文件:
#   工具本身已经是单文件,再套一层压缩包只会让下载者多一步解压;
#   校验更不用自己发 —— GitHub 会给每个附件自动算出 sha256 并显示在 Release 页面上
#   (资产列表右侧就是,还带一键复制),再发一个 .sha256 文件纯属重复。
#
# tag 会被注入进 exe 的版本信息(-p:Version),所以用户右键看文件属性就能对上版本号;
# 发布前有一道核对,版本没注入进去会直接失败。

name: Release

on:
  push:
    tags: ['v*']
  # 手动补发:tag 已推上去但这条流水线失败了,可以在这里重跑,不必删 tag 重推
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号(例如 v1.0.0)。同名 tag 不存在时,gh 会在当前分支上新建它。'
        required: true
        type: string

# 创建 Release 需要写仓库内容的权限
permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  EXE_DIR: src/HotspotGo/bin/Release/net48

jobs:
  release:
    name: 构建 · 测试 · 发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原依赖
        run: dotnet restore HotspotGo.slnx

      # 版本号必须在构建之前定下来 —— 它要作为 -p:Version 注入进二进制。
      - name: 确定版本号
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw '拿不到版本号' }

          # tag 上的 v 前缀不进版本号:v1.2.3 → 1.2.3
          $version = $tag -replace '^[vV]', ''
          if ($version -notmatch '^\d+(\.\d+)*') {
            throw "tag 不像版本号:$tag(期望 v1.2.3 这类;程序集版本号必须是数字开头)"
          }

          Write-Host "tag    :$tag"
          Write-Host "版本号 :$version"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 把 tag 当版本号注入二进制 —— 否则每个 Release 的 exe 文件属性都写着 1.0.0,
      # 用户没法判断自己下的是哪一版(见 src/HotspotGo/HotspotGo.csproj 里那段说明)。
      - name: 构建(Release)
        run: dotnet build HotspotGo.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      # 发布前必须过测试 —— 不能让没测过的构建流出去
      - name: 单元测试
        run: dotnet test HotspotGo.slnx -c Release --no-build --no-restore

      - name: 冒烟测试(真实运行 exe)
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -ExeDir '${{ env.EXE_DIR }}'

      # 核对产物存在、版本号真的进了二进制,并把体积与哈希打进日志 ——
      # 哈希只写日志、不发文件:Release 页面上 GitHub 自己会显示附件的 sha256,
      # 这里再打一份是为了在「构建产出」与「GitHub 记录」之间留个可对照的凭据。
      - name: 核对发布产物
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Join-Path '${{ env.EXE_DIR }}' 'HotspotGo.exe'
          if (-not (Test-Path $exe)) { throw "找不到构建产物:$exe" }

          $file = Get-Item $exe
          Write-Host "附件  : $($file.Name)"
          Write-Host "体积  : $($file.Length) 字节"
          Write-Host "SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower())"

          # 读 exe 自己的文件版本 —— 流水线里有个 tag 变量不代表它进了二进制,
          # 这一步就是防"发出去一个标着 1.0.0 的 v9.9.9"。
          # 预发布版(1.2.3-beta)的 FileVersion 只有数字部分,所以比数字前缀。
          $expected = '${{ steps.version.outputs.version }}'
          $numeric = ($expected -split '-')[0]
          $actual = $file.VersionInfo.FileVersion
          if (-not $actual.StartsWith("$numeric.")) {
            throw "产物版本号不对:期望 $numeric.x,实际 $actual(检查构建那步的 -p:Version)"
          }
          Write-Host "版本  : $actual"

      - name: 写发布说明
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 单引号数组拼接:避免 PowerShell here-string 的缩进约束,也让反引号保持字面量
          $notes = @(
            '一键打开 Windows 移动热点的单文件工具(命令行,无界面)。',
            '',
            '**怎么用**:下载下面的 `HotspotGo.exe`,放到任意目录双击即可 —— 不带参数就是"等电脑连上网后开启热点"。',
            '',
            '**运行要求**:64 位 Windows 10 / 11。系统自带 .NET Framework 4.8,无需另装运行时。',
            '',
            '**全部命令**:见仓库 README。',
            '',
            '**校验**:附件的 SHA256 就在下方资产列表里,由 GitHub 自动计算,可直接复制 —— 不必再下一份校验文件。',
            '',
            '> 沙箱/杀软可能拦截,首次运行请允许。日志写在 exe 同目录的 `log.txt`。'
          ) -join "`n"

          $notes | Set-Content -Path 'release-notes.md' -Encoding utf8
          Write-Host $notes

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 让 gh 的非零退出码走 $LASTEXITCODE 判断,而不是被当成终止性错误
          # (PowerShell 7.4+ 的默认行为;低版本上这行赋值无害)
          $PSNativeCommandUseErrorActionPreference = $false

          # 附件只有 exe(为什么不用 zip、不发校验文件,见文件头注释)
          $assets = @(Join-Path '${{ env.EXE_DIR }}' 'HotspotGo.exe')
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "找不到待发布的附件:$asset" }
          }

          # 同一个 tag 重跑时 Release 可能已存在,那就改为覆盖附件,而不是报错退出
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG 已存在,改为覆盖附件"
            gh release upload $env:TAG @assets --clobber
          } else {
            gh release create $env:TAG --title "HotspotGo $env:TAG" --notes-file release-notes.md @assets
          }

          if ($LASTEXITCODE -ne 0) { throw "发布失败:gh 退出码 $LASTEXITCODE" }

          Write-Host "已发布:$env:TAG"
